version: '3.8'
name: url_scraper

services:
  db:
    image: postgres:15
    container_name: url_scraper-db
    environment:
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB_FILE=/run/secrets/postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $(cat /run/secrets/postgres_user)"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crawl4ai-network
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: url_scraper-backend
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://$(cat /run/secrets/postgres_user):$(cat /run/secrets/postgres_password)@db:5432/$(cat /run/secrets/postgres_db)
      - ENCRYPTION_KEY_FILE=/run/secrets/encryption_key
    volumes:
      - ./data:/app/data
      - shared_storage:/app/shared
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crawl4ai-network
    restart: unless-stopped
    secrets:
      - postgres_user
      - postgres_password
      - postgres_db
      - encryption_key

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: url_scraper-frontend
    ports:
      - "8502:8502"
    environment:
      - API_URL=http://backend:8002
    volumes:
      - ./data:/app/data
      - shared_storage:/app/shared
    depends_on:
      - backend
    networks:
      - crawl4ai-network
    restart: unless-stopped

networks:
  crawl4ai-network:
    driver: bridge
    name: url_scraper-network

volumes:
  postgres_data:
    name: url_scraper-postgres-data
  shared_storage:
    name: url_scraper-shared-storage

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_db:
    file: ./secrets/postgres_db.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
